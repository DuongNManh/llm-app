fail_fast: true

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff lint
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]

      - id: ty-check
        name: ty type check
        entry: uv run ty check
        language: system
        pass_filenames: false